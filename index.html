<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>成績查詢入口</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="config.js"></script>
    <script defer src="assets/shared.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button id="secret-admin-trigger" class="brand brand-button" type="button" aria-label="成績查詢入口">
        <span class="brand-mark">成</span>
        <span class="brand-copy">
          <span class="brand-kicker">課程成績查詢</span>
          <span id="course-title" class="brand-title">載入中…</span>
        </span>
      </button>
    </header>

    <main class="shell">
      <section id="student-workspace" class="workspace student-workspace">
        <div class="panel query-panel">
          <div class="panel-head">
            <p class="eyebrow">學生入口</p>
            <h1>查詢個人成績</h1>
          </div>

          <form id="lookup-form" class="form">
            <label>
              <span>學號</span>
              <input id="student-id" name="studentId" inputmode="numeric" autocomplete="off" required>
            </label>
            <label>
              <span>姓名</span>
              <input id="student-name" name="name" autocomplete="name" required>
            </label>
            <button type="submit">查詢</button>
          </form>

          <p id="system-note" class="note"></p>
          <div id="lookup-status" class="status" role="status" aria-live="polite"></div>
        </div>

        <section id="result-panel" class="panel result-panel hidden" aria-live="polite">
          <div class="panel-head">
            <p class="eyebrow">查詢結果</p>
            <h2 id="student-name-output">-</h2>
          </div>
          <dl class="result-grid">
            <div>
              <dt>學號</dt>
              <dd id="student-id-output">-</dd>
            </div>
            <div>
              <dt>授課班級</dt>
              <dd id="student-course-class-output">-</dd>
            </div>
            <div>
              <dt>班級</dt>
              <dd id="student-class-output">-</dd>
            </div>
            <div>
              <dt>線上小考平均</dt>
              <dd id="quiz-score">-</dd>
            </div>
            <div>
              <dt>Zuvio test 平均</dt>
              <dd id="zuvio-score">-</dd>
            </div>
            <div>
              <dt>期中考</dt>
              <dd id="midterm-score">-</dd>
            </div>
            <div>
              <dt>期末考</dt>
              <dd id="final-score">-</dd>
            </div>
            <div class="total">
              <dt>總成績</dt>
              <dd id="total-score">-</dd>
            </div>
          </dl>
          <div id="missing-output" class="missing hidden"></div>

          <h3>各項排名</h3>
          <div class="table-wrap compact-table">
            <table>
              <thead>
                <tr>
                  <th>項目</th>
                  <th>授課班級排名</th>
                </tr>
              </thead>
              <tbody id="rank-rows"></tbody>
            </table>
          </div>

          <h3>線上小考明細</h3>
          <div class="table-wrap compact-table">
            <table class="quiz-detail-table">
              <thead>
                <tr>
                  <th>小考</th>
                  <th>最高成績</th>
                  <th>時間總和</th>
                  <th>作答次數</th>
                </tr>
              </thead>
              <tbody id="quiz-detail-rows"></tbody>
            </table>
          </div>

          <h3>Zuvio test 明細</h3>
          <div class="table-wrap compact-table">
            <table>
              <thead>
                <tr>
                  <th>測驗</th>
                  <th>成績</th>
                </tr>
              </thead>
              <tbody id="zuvio-detail-rows"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section class="panel completion-rank-panel" aria-live="polite">
        <div class="panel-head compact-head">
          <p class="eyebrow">線上小考</p>
          <h2>班級完成度排行</h2>
        </div>
        <div id="completion-rank-status" class="status">正在讀取完成度排行...</div>
        <div id="completion-rank-wrap" class="table-wrap compact-table hidden">
          <table class="completion-rank-table">
            <thead>
              <tr>
                <th>排名</th>
                <th>班級</th>
                <th>完成率</th>
                <th>進度</th>
                <th>平均分</th>
              </tr>
            </thead>
            <tbody id="completion-rank-rows"></tbody>
          </table>
        </div>
      </section>

    </main>
  </body>
</html>
